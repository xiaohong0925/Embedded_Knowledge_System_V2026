  <rect x="110" y="310" width="135" height="48" rx="5" fill="#0969da" fill-opacity="0.07"/>
  <rect x="257" y="310" width="135" height="48" rx="5" fill="#0969da" fill-opacity="0.11"/>
  <rect x="404" y="310" width="135" height="48" rx="5" fill="#0969da" fill-opacity="0.15"/>
  <rect x="551" y="310" width="135" height="48" rx="5" fill="#0969da" fill-opacity="0.21"/>

  <!-- 数值：Gen5 行 -->
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="178" y="92">3.94</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="178" y="106">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="325" y="92">15.8</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="325" y="106">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="472" y="92">31.5</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="106">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="619" y="92">63.0</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="619" y="106">GB/s</text>
  <!-- 数值：Gen4 行 -->
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="178" y="152">1.97</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="178" y="166">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="325" y="152">7.88</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="325" y="166">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="472" y="152">15.8</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="166">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="619" y="152">31.5</text>
