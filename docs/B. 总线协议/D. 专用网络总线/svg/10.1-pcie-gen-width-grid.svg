  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="472" y="212">7.88</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="226">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="619" y="212">15.8</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="619" y="226">GB/s</text>
  <!-- 数值：Gen2 行 -->
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="178" y="272">0.50</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="178" y="286">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="325" y="272">2.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="325" y="286">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="472" y="272">4.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="286">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="619" y="272">8.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="619" y="286">GB/s</text>
  <!-- 数值：Gen1 行 -->
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="178" y="332">0.25</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="178" y="346">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="325" y="332">1.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="325" y="346">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="472" y="332">2.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="346">GB/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle" x="619" y="332">4.00</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="619" y="346">GB/s</text>

  <!-- 列标签 -->
  <text class="fg" fill="#1f2328" font-size="14" font-weight="600" text-anchor="middle" x="178" y="380">x1</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="178" y="395">1 条</text>
  <text class="fg" fill="#1f2328" font-size="14" font-weight="600" text-anchor="middle" x="325" y="380">x4</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="325" y="395">4 条</text>
  <text class="fg" fill="#1f2328" font-size="14" font-weight="600" text-anchor="middle" x="472" y="380">x8</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="472" y="395">8 条</text>
  <text class="fg" fill="#1f2328" font-size="14" font-weight="600" text-anchor="middle" x="619" y="380">x16</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="middle" x="619" y="395">16 条</text>
  <text class="dim" fill="#59636e" font-size="12" text-anchor="middle" x="398" y="416">链路宽度（一条 Link 内的 Lane 数）→</text>

  <!-- 高亮：Gen5×1 与 Gen1×16 几乎同速 -->
  <rect x="106" y="66"  width="143" height="56" rx="7" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="5 4" class="an"/>
  <rect x="547" y="306" width="143" height="56" rx="7" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="5 4" class="an"/>
  <path d="M 178 66 V 40 H 690 V 364 H 619" fill="none" stroke="#9a6700" stroke-width="1.3" stroke-dasharray="5 4" class="an"/>
  <text class="anf" fill="#9a6700" font-size="12.5" text-anchor="middle" x="398" y="28">16 × Gen1 ≈ 1 × Gen5 ≈ 4 GB/s —— 宽度可以抵消代际差距</text>

  <!-- 本页实例标记：Gen4 × x4 -->
  <text class="anf" fill="#9a6700" font-size="12" text-anchor="start" x="112" y="436">◆ Gen4 x4 ≈ 7.88 GB/s（本页实例）</text>
  <text class="dim" fill="#59636e" font-size="11" text-anchor="start" x="330" y="436">颜色越深 = 带宽越大；数值为编码后单向理论带宽，不含协议开销</text>
</svg>
