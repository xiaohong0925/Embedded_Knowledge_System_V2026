<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .fg { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
      .an { stroke: #e8a33d; }
      .anf { fill: #e8a33d; }
    }
  </style>

  <!-- 纵轴标题：代际 -->
  <text class="fg" fill="#1f2328" font-size="13" text-anchor="middle" transform="rotate(-90 40 214)" x="40" y="214">代际（每 Lane 符号率）↑</text>

  <!-- 行标签 + 每 Lane 符号率 -->
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="end" x="98" y="92">Gen5</text>
  <text class="dim" fill="#59636e" font-size="11" text-anchor="end" x="98" y="108">32 GT/s</text>
  <text class="fg" fill="#1f2328" font-size="15" font-weight="600" text-anchor="end" x="98" y="152">Gen4</text>
