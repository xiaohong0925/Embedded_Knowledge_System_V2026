<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .fg { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
      .an { stroke: #e8a33d; }
      .anf { fill: #e8a33d; }
      .mb { fill: #161b22; stroke: #30363d; }
      .dev { fill: #0d1117; stroke: #30363d; }
      .pin { fill: #484f58; }
      .box { stroke: #30363d; }
    }
  </style>

  <!-- 主板 -->
  <rect class="mb" x="60" y="344" width="660" height="36" fill="#eef1f4" stroke="#d0d7de" rx="3"/>
  <text class="fg" fill="#1f2328" font-size="13" x="90" y="367">主板（主机侧）</text>

  <!-- 插槽连接器外壳 -->
  <rect x="250" y="266" width="400" height="70" rx="6" fill="none" stroke="#d0d7de" class="box" stroke-dasharray="4 3"/>
  <text class="fg" fill="#1f2328" font-size="12.5" text-anchor="end" x="240" y="306">插槽连接器</text>
  <text class="dim" fill="#59636e" font-size="10" text-anchor="end" x="240" y="322">（仅画出 PRSNT 相关引脚）</text>

  <!-- 回路高亮：GND → 左触点 → 卡内短接 → 右触点 → 上拉检测点 -->
  <path d="M 200 380 V 360 H 400 V 146" fill="none" stroke="#9a6700" stroke-width="2.2" class="an"/>
  <path d="M 480 286 V 360 H 620 V 240" fill="none" stroke="#9a6700" stroke-width="2.2" class="an"/>
  <polygon class="anf" fill="#9a6700" points="400,140 393,154 407,154"/>

  <!-- 触点弹片 -->
  <rect class="pin" x="384" y="116" width="32" height="30" rx="3" fill="#d0d7de" stroke="#9a6700" stroke-width="1.6"/>
  <rect class="pin" x="464" y="256" width="32" height="30" rx="3" fill="#d0d7de" stroke="#9a6700" stroke-width="1.6"/>
  <text class="fg" fill="#1f2328" font-size="12.5" text-anchor="end" x="376" y="130">PRSNT1#（A1）</text>
  <text class="dim" fill="#59636e" font-size="10.5" text-anchor="end" x="376" y="147">主板侧接 GND</text>
  <text class="fg" fill="#1f2328" font-size="12.5" x="508" y="248">PRSNT2#（B31）</text>

  <!-- 卡的 PCB 边缘（剖面） -->
  <rect class="dev" x="420" y="70" width="40" height="240" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="fg" fill="#1f2328" font-size="12" text-anchor="end" x="412" y="90">卡的 PCB 边缘（剖面）</text>
  <polygon class="fg" fill="#1f2328" points="440,64 432,50 448,50"/>
  <text class="fg" fill="#1f2328" font-size="11.5" text-anchor="middle" x="440" y="40">插入方向</text>

  <!-- 卡上的焊盘 + 卡内短接走线 -->
  <rect class="anf" x="414" y="124" width="12" height="14" fill="#9a6700"/>
  <rect class="anf" x="454" y="264" width="12" height="14" fill="#9a6700"/>
  <path d="M 426 131 H 438 V 271 H 454" fill="none" stroke="#9a6700" stroke-width="2.2" class="an"/>
  <polygon class="anf" fill="#9a6700" points="438,203 431,191 445,191"/>
  <line x1="447" y1="197" x2="468" y2="197" stroke="#59636e" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text class="anf" fill="#9a6700" font-size="12" x="474" y="201">卡内短接走线</text>

  <!-- GND 符号 -->
  <line x1="200" y1="380" x2="200" y2="386" stroke="#59636e" stroke-width="2"/>
  <line x1="188" y1="386" x2="212" y2="386" stroke="#59636e" stroke-width="2"/>
  <line x1="194" y1="392" x2="206" y2="392" stroke="#59636e" stroke-width="2"/>
  <line x1="197" y1="398" x2="203" y2="398" stroke="#59636e" stroke-width="2"/>
  <text class="dim" fill="#59636e" font-size="11" text-anchor="middle" x="200" y="418">GND</text>

  <!-- 上拉电阻与 VCC -->
  <polyline points="620,240 611,232 629,221 611,210 629,199 611,188 620,180" fill="none" stroke="#59636e" stroke-width="2"/>
  <line x1="620" y1="180" x2="652" y2="180" stroke="#59636e" stroke-width="2"/>
  <text class="fg" fill="#1f2328" font-size="11.5" x="660" y="184">VCC</text>
  <text class="dim" fill="#59636e" font-size="11" text-anchor="end" x="606" y="216">上拉电阻</text>
  <circle cx="620" cy="240" r="3.5" class="anf" fill="#9a6700"/>
  <text class="anf" fill="#9a6700" font-size="11.5" x="632" y="245">检测点 · 读到 0 ＝ 有卡</text>

  <!-- 检测范围说明框 -->
  <text class="fg" fill="#1f2328" font-size="12" x="505" y="100">本图以 x4 卡的 B31 检测点为例</text>
  <text class="fg" fill="#1f2328" font-size="12" x="505" y="122">具体引脚按目标 CEM 版本核对</text>
  <text class="fg" fill="#1f2328" font-size="12" x="505" y="144">检测回路只回答“卡是否存在”</text>
  <text class="anf" fill="#9a6700" font-size="12" x="505" y="166">不能据此推断实际 Lane 协商结果</text>

  <!-- 底部注释 -->
  <text class="dim" fill="#59636e" font-size="11.5" x="60" y="430">较短触点辅助实现较晚接通、较早分离的插拔顺序，不独立保证带电插拔安全。</text>
  <text class="dim" fill="#59636e" font-size="11.5" x="60" y="447">支持热插拔的平台读取在位状态，再由 pciehp 等软件参与后续处理。</text>
</svg>
