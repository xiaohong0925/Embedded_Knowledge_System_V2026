<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">0x0B Fast Read 完整帧与两种拍号</title>
<desc id="desc">命令八拍、地址二十四拍、dummy 八拍构成四十拍前导。首个数据字节 A7 在手册零基编号中是 clock 40 到 47，在正文一基编号中是第 41 到 48 拍。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18222d}
    .line{fill:none;stroke:#18222d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:none;stroke:#72808d;stroke-width:1.5;stroke-dasharray:5 5}
    .box{fill:#f5f7f9;stroke:#18222d;stroke-width:2}
    .accent{fill:none;stroke:#d95f02;stroke-width:3}
    .blue{fill:none;stroke:#1769aa;stroke-width:2.5}
    .label{font-size:18px}.small{font-size:15px;fill:#4c5966}.tiny{font-size:13px;fill:#4c5966}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="800" y="40" text-anchor="middle" font-size="25" font-weight="700">0x0B Fast Read：先数 40 拍前导，再进入数据</text>
<text x="800" y="70" text-anchor="middle" class="small">单线、SDR、MSB-first；以下均为依据手册作出的机制推演，不是实测波形</text>

<text x="40" y="125" class="label">线上阶段</text>
<rect x="180" y="95" width="144" height="86" fill="#e8f1f8" stroke="#1769aa" stroke-width="2"/>
<rect x="324" y="95" width="432" height="86" fill="#f4f7fa" stroke="#18222d" stroke-width="2"/>
<rect x="756" y="95" width="144" height="86" fill="#f0f1f2" stroke="#72808d" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="900" y="95" width="144" height="86" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/>
<rect x="1044" y="95" width="144" height="86" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
<rect x="1188" y="95" width="144" height="86" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
<rect x="1332" y="95" width="144" height="86" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
<text x="252" y="130" text-anchor="middle" class="label">命令 0x0B</text><text x="252" y="158" text-anchor="middle" class="small">MOSI · 8 拍</text>
<text x="540" y="130" text-anchor="middle" class="label">地址 00 12 34</text><text x="540" y="158" text-anchor="middle" class="small">MOSI · 24 拍</text>
<text x="828" y="130" text-anchor="middle" class="label">dummy</text><text x="828" y="158" text-anchor="middle" class="small">8 拍</text>
<text x="972" y="130" text-anchor="middle" class="label">A7</text><text x="972" y="158" text-anchor="middle" class="small">MISO · 8 拍</text>
<text x="1116" y="130" text-anchor="middle" class="label">5C</text><text x="1116" y="158" text-anchor="middle" class="small">8 拍</text>
<text x="1260" y="130" text-anchor="middle" class="label">3F</text><text x="1260" y="158" text-anchor="middle" class="small">8 拍</text>
<text x="1404" y="130" text-anchor="middle" class="label">19</text><text x="1404" y="158" text-anchor="middle" class="small">8 拍</text>

<text x="40" y="215" class="small">手册 0 基 clock</text>
<text x="252" y="215" text-anchor="middle" class="small">0～7</text><text x="540" y="215" text-anchor="middle" class="small">8～31</text><text x="828" y="215" text-anchor="middle" class="small">32～39</text>
<text x="972" y="215" text-anchor="middle" class="small">40～47</text><text x="1116" y="215" text-anchor="middle" class="small">48～55</text><text x="1260" y="215" text-anchor="middle" class="small">56～63</text><text x="1404" y="215" text-anchor="middle" class="small">64～71</text>
<text x="40" y="250" class="small">正文 1 基拍号</text>
<text x="252" y="250" text-anchor="middle" class="small">1～8</text><text x="540" y="250" text-anchor="middle" class="small">9～32</text><text x="828" y="250" text-anchor="middle" class="small">33～40</text>
<text x="972" y="250" text-anchor="middle" class="small">41～48</text><text x="1116" y="250" text-anchor="middle" class="small">49～56</text><text x="1260" y="250" text-anchor="middle" class="small">57～64</text><text x="1404" y="250" text-anchor="middle" class="small">65～72</text>

<text x="40" y="298" class="label">CS</text><path class="line" d="M120 270H155V298H1500V270H1535"/>
<text x="540" y="324" text-anchor="middle" class="small">前导：8 + 24 + 8 = 40 拍；CS 在整笔事务期间保持有效</text>
<path class="accent" marker-end="url(#arrow)" d="M900 338V370"/>
<text x="925" y="358" class="small">首枚有效数据位</text>

<text x="800" y="410" text-anchor="middle" font-size="21" font-weight="700">放大首个数据字节 A7 = 1010 0111</text>
<text x="300" y="455" text-anchor="end" class="label">位编号</text>
<text x="300" y="515" text-anchor="end" class="label">MISO 位值</text>
<text x="300" y="575" text-anchor="end" class="small">手册 0 基 clock</text>
<text x="300" y="635" text-anchor="end" class="small">正文 1 基拍号</text>
<g>
  <rect class="box" x="340" y="430" width="140" height="50"/><rect class="box" x="480" y="430" width="140" height="50"/><rect class="box" x="620" y="430" width="140" height="50"/><rect class="box" x="760" y="430" width="140" height="50"/><rect class="box" x="900" y="430" width="140" height="50"/><rect class="box" x="1040" y="430" width="140" height="50"/><rect class="box" x="1180" y="430" width="140" height="50"/><rect class="box" x="1320" y="430" width="140" height="50"/>
  <text x="410" y="462" text-anchor="middle" class="label">b7</text><text x="550" y="462" text-anchor="middle" class="label">b6</text><text x="690" y="462" text-anchor="middle" class="label">b5</text><text x="830" y="462" text-anchor="middle" class="label">b4</text><text x="970" y="462" text-anchor="middle" class="label">b3</text><text x="1110" y="462" text-anchor="middle" class="label">b2</text><text x="1250" y="462" text-anchor="middle" class="label">b1</text><text x="1390" y="462" text-anchor="middle" class="label">b0</text>
  <rect x="340" y="490" width="140" height="50" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/><rect x="480" y="490" width="140" height="50" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="620" y="490" width="140" height="50" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/><rect x="760" y="490" width="140" height="50" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="900" y="490" width="140" height="50" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1040" y="490" width="140" height="50" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/><rect x="1180" y="490" width="140" height="50" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/><rect x="1320" y="490" width="140" height="50" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/>
  <text x="410" y="522" text-anchor="middle" class="label">1</text><text x="550" y="522" text-anchor="middle" class="label">0</text><text x="690" y="522" text-anchor="middle" class="label">1</text><text x="830" y="522" text-anchor="middle" class="label">0</text><text x="970" y="522" text-anchor="middle" class="label">0</text><text x="1110" y="522" text-anchor="middle" class="label">1</text><text x="1250" y="522" text-anchor="middle" class="label">1</text><text x="1390" y="522" text-anchor="middle" class="label">1</text>
  <text x="410" y="580" text-anchor="middle" class="small">40</text><text x="550" y="580" text-anchor="middle" class="small">41</text><text x="690" y="580" text-anchor="middle" class="small">42</text><text x="830" y="580" text-anchor="middle" class="small">43</text><text x="970" y="580" text-anchor="middle" class="small">44</text><text x="1110" y="580" text-anchor="middle" class="small">45</text><text x="1250" y="580" text-anchor="middle" class="small">46</text><text x="1390" y="580" text-anchor="middle" class="small">47</text>
  <text x="410" y="640" text-anchor="middle" class="small">41</text><text x="550" y="640" text-anchor="middle" class="small">42</text><text x="690" y="640" text-anchor="middle" class="small">43</text><text x="830" y="640" text-anchor="middle" class="small">44</text><text x="970" y="640" text-anchor="middle" class="small">45</text><text x="1110" y="640" text-anchor="middle" class="small">46</text><text x="1250" y="640" text-anchor="middle" class="small">47</text><text x="1390" y="640" text-anchor="middle" class="small">48</text>
</g>
<text x="800" y="690" text-anchor="middle" class="label">同一采样位置：1 基拍号 = 0 基 clock 编号 + 1</text>
<text x="800" y="725" text-anchor="middle" class="small">数据位置由前导拍数确定；dummy 期间 MISO 的跳变或采到 1 都不能作为数据起点</text>
</svg>
