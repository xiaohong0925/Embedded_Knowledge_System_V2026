<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Noto Sans CJK SC,sans-serif"><defs><marker id="arr767" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#76767e"/></marker><marker id="arr1fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1fa972"/></marker><marker id="arr2b7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b7fff"/></marker><marker id="arr7c4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c4dff"/></marker><marker id="arrf5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5a623"/></marker></defs><text x="480" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f1f23">四层对象的数据流：一笔 Fast Read 谁管什么、谁交给谁</text><rect x="50" y="48" width="190" height="48" rx="8" fill="#f7f7f8" stroke="#e3e3e8" stroke-width="1.4"/><text x="145.0" y="69" font-size="12" font-weight="bold" text-anchor="middle" fill="#a6a6ae">设备树 DTS</text><text x="145.0" y="89" font-size="9" text-anchor="middle" fill="#a6a6ae">只描述，不跑代码</text><rect x="270" y="48" width="190" height="48" rx="8" fill="#e8f7f0" stroke="#1fa972" stroke-width="1.4"/><text x="365.0" y="69" font-size="12" font-weight="bold" text-anchor="middle" fill="#1fa972">协议驱动</text><text x="365.0" y="89" font-size="9" text-anchor="middle" fill="#a6a6ae">你写的代码，懂 0x0B</text><rect x="490" y="48" width="190" height="48" rx="8" fill="#eaf3ff" stroke="#2b7fff" stroke-width="1.4"/><text x="585.0" y="69" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b7fff">SPI Core</text><text x="585.0" y="89" font-size="9" text-anchor="middle" fill="#a6a6ae">spi.c，调度/匹配/排队</text><rect x="710" y="48" width="190" height="48" rx="8" fill="#f0ebff" stroke="#7c4dff" stroke-width="1.4"/><text x="805.0" y="69" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c4dff">控制器驱动</text><text x="805.0" y="89" font-size="9" text-anchor="middle" fill="#a6a6ae">spi-rockchip.c，管硬件</text><rect x="10" y="120" width="80" height="28" rx="6" fill="white" stroke="#1fa972" stroke-width="1"/><text x="50" y="139" font-size="10" font-weight="bold" text-anchor="middle" fill="#1fa972">① 设备创建</text><rect x="55" y="120" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="145.0" y="139" font-size="10" text-anchor="middle" fill="#1f1f23">DTS 子节点</text><rect x="275" y="120" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="365.0" y="139" font-size="10" text-anchor="middle" fill="#1f1f23">compatible 字符串</text><rect x="495" y="120" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="585.0" y="139" font-size="10" text-anchor="middle" fill="#1f1f23">spi_device (spi1.0)</text><line x1="240" y1="134" x2="270" y2="134" stroke="#76767e" stroke-width="1.4" marker-end="url(#arr767)"/><text x="255.0" y="128" font-size="8" text-anchor="middle" fill="#76767e">解析</text><line x1="490" y1="134" x2="460" y2="134" stroke="#2b7fff" stroke-width="1.4" marker-end="url(#arr2b7)"/><text x="475.0" y="128" font-size="8" text-anchor="middle" fill="#2b7fff">probe</text><line x1="365" y1="152" x2="365" y2="206" stroke="#1fa972" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr1fa)"/><text x="377" y="183.0" font-size="9" fill="#1fa972">probe 成功</text><rect x="10" y="210" width="80" height="28" rx="6" fill="white" stroke="#2b7fff" stroke-width="1"/><text x="50" y="229" font-size="10" font-weight="bold" text-anchor="middle" fill="#2b7fff">② 组装请求</text><rect x="275" y="210" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="365.0" y="229" font-size="10" text-anchor="middle" fill="#1f1f23">tx[5] + rx[4]</text><rect x="495" y="210" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="585.0" y="229" font-size="10" text-anchor="middle" fill="#1f1f23">spi_message</text><line x1="460" y1="224" x2="490" y2="224" stroke="#1fa972" stroke-width="1.4" marker-end="url(#arr1fa)"/><text x="475.0" y="218" font-size="8" text-anchor="middle" fill="#1fa972">spi_sync()</text><line x1="585" y1="242" x2="585" y2="296" stroke="#2b7fff" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr2b7)"/><text x="597" y="273.0" font-size="9" fill="#2b7fff">提交事务</text><rect x="10" y="300" width="80" height="28" rx="6" fill="white" stroke="#7c4dff" stroke-width="1"/><text x="50" y="319" font-size="10" font-weight="bold" text-anchor="middle" fill="#7c4dff">③ 调度执行</text><rect x="495" y="300" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="585.0" y="319" font-size="10" text-anchor="middle" fill="#1f1f23">transfer_one()</text><rect x="715" y="300" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="805.0" y="319" font-size="10" text-anchor="middle" fill="#1f1f23">寄存器 → 波形</text><line x1="680" y1="314" x2="710" y2="314" stroke="#2b7fff" stroke-width="1.4" marker-end="url(#arr2b7)"/><text x="695.0" y="308" font-size="8" text-anchor="middle" fill="#2b7fff">transfer_one</text><line x1="805" y1="332" x2="805" y2="386" stroke="#7c4dff" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr7c4)"/><text x="817" y="363.0" font-size="9" fill="#7c4dff">执行完成</text><rect x="10" y="390" width="80" height="28" rx="6" fill="white" stroke="#f5a623" stroke-width="1"/><text x="50" y="409" font-size="10" font-weight="bold" text-anchor="middle" fill="#f5a623">④ 完成返回</text><rect x="275" y="390" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="365.0" y="409" font-size="10" text-anchor="middle" fill="#1f1f23">rx[0..3]</text><rect x="495" y="390" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="585.0" y="409" font-size="10" text-anchor="middle" fill="#1f1f23">actual_length</text><rect x="715" y="390" width="180" height="28" rx="6" fill="white" stroke="#e3e3e8" stroke-width="0.8"/><text x="805.0" y="409" font-size="10" text-anchor="middle" fill="#1f1f23">中断/DMA 完成</text><line x1="710" y1="404" x2="680" y2="404" stroke="#7c4dff" stroke-width="1.4" marker-end="url(#arr7c4)"/><text x="695.0" y="398" font-size="8" text-anchor="middle" fill="#7c4dff">complete</text><line x1="490" y1="404" x2="460" y2="404" stroke="#2b7fff" stroke-width="1.4" marker-end="url(#arr2b7)"/><text x="475.0" y="398" font-size="8" text-anchor="middle" fill="#2b7fff">唤醒返回</text><text x="480" y="460" font-size="11" text-anchor="middle" fill="#1f1f23">关键记忆：协议驱动写"发什么"，Core 写"怎么调度"，控制器写"怎么让硬件移位"，DTS 写"接在哪"</text><text x="480" y="480" font-size="10" text-anchor="middle" fill="#a6a6ae">纵向箭头 = 阶段推进；横向箭头 = 同阶段内对象交互；虚线 = buffer 指针传递，不动数据本身</text><path d="M370 248 Q480 190 590 248" fill="none" stroke="#e3e3e8" stroke-width="1" stroke-dasharray="3 3"/><text x="480" y="210" font-size="9" text-anchor="middle" fill="#a6a6ae">数据流：buffer 指针向下传递，不动数据本身</text></svg>