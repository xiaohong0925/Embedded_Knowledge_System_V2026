<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">SPI 四种模式的空闲、首位、采样和更新</title>
<desc id="desc">Mode 0 到 3 的 CPOL、CPHA、采样边沿、更新边沿和首位预载或更新时机对比。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18222d}
    .line{fill:none;stroke:#18222d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:none;stroke:#72808d;stroke-width:1.5;stroke-dasharray:5 5}
    .box{fill:#f5f7f9;stroke:#18222d;stroke-width:2}
    .accent{fill:none;stroke:#d95f02;stroke-width:3}
    .blue{fill:none;stroke:#1769aa;stroke-width:2.5}
    .label{font-size:18px} .small{font-size:15px;fill:#4c5966} .tiny{font-size:13px;fill:#4c5966}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="550" y="38" text-anchor="middle" font-size="25" font-weight="700">CPOL × CPHA：从空闲电平与第几个边沿推出四种模式</text><text x="550" y="67" text-anchor="middle" class="small">S＝采样，U＝更新；每格画两个时钟；首位阴影表示预载或首边沿更新后的稳定区间</text><rect x="35" y="95" width="510" height="260" fill="#f7f9fa" stroke="#d5dde3"/><text x="53" y="130" font-size="22" font-weight="700">Mode 0　CPOL=0　CPHA=0</text><text x="53" y="158" class="small">空闲低；上升沿采样，下降沿更新</text><path class="line" d="M120 250H120.0V195H167.5H167.5V250H215.0H215.0V195H262.5H262.5V250H310.0"/><path class="soft" d="M120.0 177V310"/><text x="120.0" y="180" text-anchor="middle" class="small">S</text><text x="120.0" y="276" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M167.5 177V310"/><text x="167.5" y="180" text-anchor="middle" class="small">U</text><text x="167.5" y="276" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M215.0 177V310"/><text x="215.0" y="180" text-anchor="middle" class="small">S</text><text x="215.0" y="276" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M262.5 177V310"/><text x="262.5" y="180" text-anchor="middle" class="small">U</text><text x="262.5" y="276" text-anchor="middle" class="tiny">下降</text><rect x="85" y="295" width="95" height="24" fill="#ffe7d1" stroke="#d95f02"/><text x="132.5" y="313" text-anchor="middle" class="tiny">b7</text><rect x="180" y="295" width="95" height="24" fill="#e5eef5" stroke="#1769aa"/><text x="227.5" y="313" text-anchor="middle" class="tiny">b6</text><text x="345" y="313" class="small">首边沿前预载</text><rect x="575" y="95" width="510" height="260" fill="#f7f9fa" stroke="#d5dde3"/><text x="593" y="130" font-size="22" font-weight="700">Mode 1　CPOL=0　CPHA=1</text><text x="593" y="158" class="small">空闲低；下降沿采样，上升沿更新</text><path class="line" d="M660 250H660.0V195H707.5H707.5V250H755.0H755.0V195H802.5H802.5V250H850.0"/><path class="soft" d="M660.0 177V310"/><text x="660.0" y="180" text-anchor="middle" class="small">U</text><text x="660.0" y="276" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M707.5 177V310"/><text x="707.5" y="180" text-anchor="middle" class="small">S</text><text x="707.5" y="276" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M755.0 177V310"/><text x="755.0" y="180" text-anchor="middle" class="small">U</text><text x="755.0" y="276" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M802.5 177V310"/><text x="802.5" y="180" text-anchor="middle" class="small">S</text><text x="802.5" y="276" text-anchor="middle" class="tiny">下降</text><rect x="660" y="295" width="95" height="24" fill="#ffe7d1" stroke="#d95f02"/><text x="707.5" y="313" text-anchor="middle" class="tiny">b7</text><rect x="755" y="295" width="95" height="24" fill="#e5eef5" stroke="#1769aa"/><text x="802.5" y="313" text-anchor="middle" class="tiny">b6</text><text x="885" y="313" class="small">首边沿更新</text><rect x="35" y="385" width="510" height="260" fill="#f7f9fa" stroke="#d5dde3"/><text x="53" y="420" font-size="22" font-weight="700">Mode 2　CPOL=1　CPHA=0</text><text x="53" y="448" class="small">空闲高；下降沿采样，上升沿更新</text><path class="line" d="M120 485H120.0V540H167.5H167.5V485H215.0H215.0V540H262.5H262.5V485H310.0"/><path class="soft" d="M120.0 467V600"/><text x="120.0" y="470" text-anchor="middle" class="small">S</text><text x="120.0" y="566" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M167.5 467V600"/><text x="167.5" y="470" text-anchor="middle" class="small">U</text><text x="167.5" y="566" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M215.0 467V600"/><text x="215.0" y="470" text-anchor="middle" class="small">S</text><text x="215.0" y="566" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M262.5 467V600"/><text x="262.5" y="470" text-anchor="middle" class="small">U</text><text x="262.5" y="566" text-anchor="middle" class="tiny">上升</text><rect x="85" y="585" width="95" height="24" fill="#ffe7d1" stroke="#d95f02"/><text x="132.5" y="603" text-anchor="middle" class="tiny">b7</text><rect x="180" y="585" width="95" height="24" fill="#e5eef5" stroke="#1769aa"/><text x="227.5" y="603" text-anchor="middle" class="tiny">b6</text><text x="345" y="603" class="small">首边沿前预载</text><rect x="575" y="385" width="510" height="260" fill="#f7f9fa" stroke="#d5dde3"/><text x="593" y="420" font-size="22" font-weight="700">Mode 3　CPOL=1　CPHA=1</text><text x="593" y="448" class="small">空闲高；上升沿采样，下降沿更新</text><path class="line" d="M660 485H660.0V540H707.5H707.5V485H755.0H755.0V540H802.5H802.5V485H850.0"/><path class="soft" d="M660.0 467V600"/><text x="660.0" y="470" text-anchor="middle" class="small">U</text><text x="660.0" y="566" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M707.5 467V600"/><text x="707.5" y="470" text-anchor="middle" class="small">S</text><text x="707.5" y="566" text-anchor="middle" class="tiny">上升</text><path class="soft" d="M755.0 467V600"/><text x="755.0" y="470" text-anchor="middle" class="small">U</text><text x="755.0" y="566" text-anchor="middle" class="tiny">下降</text><path class="soft" d="M802.5 467V600"/><text x="802.5" y="470" text-anchor="middle" class="small">S</text><text x="802.5" y="566" text-anchor="middle" class="tiny">上升</text><rect x="660" y="585" width="95" height="24" fill="#ffe7d1" stroke="#d95f02"/><text x="707.5" y="603" text-anchor="middle" class="tiny">b7</text><rect x="755" y="585" width="95" height="24" fill="#e5eef5" stroke="#1769aa"/><text x="802.5" y="603" text-anchor="middle" class="tiny">b6</text><text x="885" y="603" class="small">首边沿更新</text><text x="550" y="680" text-anchor="middle" class="small">本例 Flash 支持 Mode 0 与 Mode 3；Mode 1、2 仅用于通用模式推导</text>
</svg>