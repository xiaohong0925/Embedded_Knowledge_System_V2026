<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">同一笔 Fast Read 到两种接收缓冲区布局的映射</title>
<desc id="desc">线上都是四十拍前导后输出 A7 5C 3F 19。等长全双工缓冲区中首数据位于 RX5；只有驱动约定应用接收缓冲区只保存数据段时，首数据才位于 RX0。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18222d}
    .line{fill:none;stroke:#18222d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:none;stroke:#72808d;stroke-width:1.5;stroke-dasharray:5 5}
    .box{fill:#f5f7f9;stroke:#18222d;stroke-width:2}
    .accent{fill:none;stroke:#d95f02;stroke-width:3}
    .blue{fill:none;stroke:#1769aa;stroke-width:2.5}
    .label{font-size:18px}.small{font-size:15px;fill:#4c5966}.tiny{font-size:13px;fill:#4c5966}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="700" y="40" text-anchor="middle" font-size="25" font-weight="700">同一笔线上事务，为什么既可能取 RX[5]，也可能取 RX[0]</text>
<text x="700" y="70" text-anchor="middle" class="small">读 4 字节的教学假设；两种布局不是两种协议，而是两种驱动接口约定</text>

<text x="40" y="120" class="label">线上事务</text>
<text x="40" y="146" class="small">每字节 8 拍</text>
<g>
  <rect x="300" y="95" width="110" height="70" fill="#f0f1f2" stroke="#72808d" stroke-width="2"/><rect x="410" y="95" width="110" height="70" fill="#f0f1f2" stroke="#72808d" stroke-width="2"/><rect x="520" y="95" width="110" height="70" fill="#f0f1f2" stroke="#72808d" stroke-width="2"/><rect x="630" y="95" width="110" height="70" fill="#f0f1f2" stroke="#72808d" stroke-width="2"/><rect x="740" y="95" width="110" height="70" fill="#f0f1f2" stroke="#72808d" stroke-width="2"/>
  <rect x="850" y="95" width="110" height="70" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/><rect x="960" y="95" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1070" y="95" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1180" y="95" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
  <text x="355" y="137" text-anchor="middle" class="label">0x0B</text><text x="465" y="137" text-anchor="middle" class="label">00</text><text x="575" y="137" text-anchor="middle" class="label">12</text><text x="685" y="137" text-anchor="middle" class="label">34</text><text x="795" y="137" text-anchor="middle" class="label">dummy</text>
  <text x="905" y="137" text-anchor="middle" class="label">A7</text><text x="1015" y="137" text-anchor="middle" class="label">5C</text><text x="1125" y="137" text-anchor="middle" class="label">3F</text><text x="1235" y="137" text-anchor="middle" class="label">19</text>
</g>
<path class="line" d="M300 195V215H850V195"/><text x="575" y="242" text-anchor="middle" class="small">命令＋地址＋dummy：5 字节，共 40 拍</text>
<path class="accent" d="M850 195V215H1290V195"/><text x="1070" y="242" text-anchor="middle" class="small">有效数据：4 字节，从第 41 拍开始</text>

<path class="blue" marker-end="url(#arrow)" d="M1070 275V315"/><text x="1090" y="300" class="small">接口怎样交付数据？</text>

<text x="40" y="340" font-size="20" font-weight="700">模型 A：等长全双工</text>
<text x="40" y="368" class="small">TX／RX 等长，逐字节同步接收</text>
<g>
  <rect class="box" x="300" y="330" width="110" height="70"/><rect class="box" x="410" y="330" width="110" height="70"/><rect class="box" x="520" y="330" width="110" height="70"/><rect class="box" x="630" y="330" width="110" height="70"/><rect class="box" x="740" y="330" width="110" height="70"/>
  <rect x="850" y="330" width="110" height="70" fill="#fff1e5" stroke="#d95f02" stroke-width="3"/><rect x="960" y="330" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1070" y="330" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1180" y="330" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
  <text x="355" y="372" text-anchor="middle" class="label">?</text><text x="465" y="372" text-anchor="middle" class="label">?</text><text x="575" y="372" text-anchor="middle" class="label">?</text><text x="685" y="372" text-anchor="middle" class="label">?</text><text x="795" y="372" text-anchor="middle" class="label">?</text>
  <text x="905" y="372" text-anchor="middle" class="label">A7</text><text x="1015" y="372" text-anchor="middle" class="label">5C</text><text x="1125" y="372" text-anchor="middle" class="label">3F</text><text x="1235" y="372" text-anchor="middle" class="label">19</text>
  <text x="355" y="428" text-anchor="middle" class="small">RX[0]</text><text x="465" y="428" text-anchor="middle" class="small">RX[1]</text><text x="575" y="428" text-anchor="middle" class="small">RX[2]</text><text x="685" y="428" text-anchor="middle" class="small">RX[3]</text><text x="795" y="428" text-anchor="middle" class="small">RX[4]</text>
  <text x="905" y="428" text-anchor="middle" class="small">RX[5]</text><text x="1015" y="428" text-anchor="middle" class="small">RX[6]</text><text x="1125" y="428" text-anchor="middle" class="small">RX[7]</text><text x="1235" y="428" text-anchor="middle" class="small">RX[8]</text>
</g>
<text x="575" y="462" text-anchor="middle" class="small">前五项不参与数据判断，不要假定为 00 或 FF</text>

<path class="soft" d="M300 495H1290"/>
<text x="40" y="535" font-size="20" font-weight="700">模型 B：应用 RX 只保存数据段</text>
<text x="40" y="563" class="small">必须由驱动或接口文档明确约定</text>
<text x="575" y="585" text-anchor="middle" class="small">前导仍在线上发生，但未放进这个应用缓冲区</text>
<path class="accent" marker-end="url(#arrow)" d="M850 555V585"/>
<g>
  <rect x="850" y="600" width="110" height="70" fill="#fff1e5" stroke="#d95f02" stroke-width="3"/><rect x="960" y="600" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1070" y="600" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/><rect x="1180" y="600" width="110" height="70" fill="#fff8f1" stroke="#d95f02" stroke-width="2"/>
  <text x="905" y="642" text-anchor="middle" class="label">A7</text><text x="1015" y="642" text-anchor="middle" class="label">5C</text><text x="1125" y="642" text-anchor="middle" class="label">3F</text><text x="1235" y="642" text-anchor="middle" class="label">19</text>
  <text x="905" y="698" text-anchor="middle" class="small">RX[0]</text><text x="1015" y="698" text-anchor="middle" class="small">RX[1]</text><text x="1125" y="698" text-anchor="middle" class="small">RX[2]</text><text x="1235" y="698" text-anchor="middle" class="small">RX[3]</text>
</g>
<text x="700" y="742" text-anchor="middle" class="label">不变的是线上 40 拍前导；变化的是驱动把哪些字节交给应用</text>
<text x="700" y="768" text-anchor="middle" class="tiny">“线上数据单独成段”本身不足以证明模型 B，必须继续查缓冲区约定</text>
</svg>
