<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 468" width="920" height="468" font-family="Noto Sans CJK SC,sans-serif"><defs><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1fa972"/></marker></defs><text x="460.0" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f1f23">独立片选多从机：共享线路，不共享驱动权</text><text x="460.0" y="47" font-size="11" text-anchor="middle" fill="#76767e">N 个从机 = N+3 根信号线：SCLK、MOSI、MISO 三路共享 + 每从机一根独立 CS（图中 N=3，共 6 根）</text><line x1="170" y1="100" x2="870" y2="100" stroke="#1f1f23" stroke-width="1.8"/><line x1="170" y1="140" x2="870" y2="140" stroke="#1f1f23" stroke-width="1.8"/><line x1="174" y1="180" x2="870" y2="180" stroke="#1fa972" stroke-width="2.5" marker-end="url(#ahg)"/><text x="176" y="96" font-size="11" fill="#76767e">SCLK</text><text x="176" y="136" font-size="11" fill="#76767e">MOSI</text><text x="176" y="170" font-size="11" fill="#76767e">MISO</text><text x="285" y="170" font-size="11" fill="#1fa972">MISO：由从机 1 驱动 → 主机</text><rect x="40" y="110" width="130" height="130" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="105" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f1f23">主机</text><text x="105" y="170" font-size="10" text-anchor="middle" fill="#76767e">SCLK / MOSI / MISO</text><text x="105" y="186" font-size="10" text-anchor="middle" fill="#76767e">CS0 CS1 CS2</text><rect x="390" y="70" width="130" height="130" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="455" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f1f23">从机 0</text><text x="455" y="112" font-size="10" text-anchor="middle" fill="#76767e">忽略本次 · MISO 高阻</text><rect x="560" y="70" width="130" height="130" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="625" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f1f23">从机 1</text><text x="625" y="112" font-size="10" text-anchor="middle" fill="#1fa972">被选中 · 驱动 MISO</text><rect x="730" y="70" width="130" height="130" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="795" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f1f23">从机 2</text><text x="795" y="112" font-size="10" text-anchor="middle" fill="#76767e">忽略本次 · MISO 高阻</text><circle cx="390" cy="100" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="390" cy="140" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="390" cy="180" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="560" cy="100" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="560" cy="140" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="560" cy="180" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="730" cy="100" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="730" cy="140" r="3" fill="#1f1f23" opacity="0.6"/><circle cx="730" cy="180" r="3" fill="#1f1f23" opacity="0.6"/><rect x="430" y="186" width="44" height="18" rx="9" fill="white" stroke="#a6a6ae"/><text x="452" y="199" font-size="9" text-anchor="middle" fill="#76767e">高阻</text><rect x="770" y="186" width="44" height="18" rx="9" fill="white" stroke="#a6a6ae"/><text x="792" y="199" font-size="9" text-anchor="middle" fill="#76767e">高阻</text><path d="M170 250 H455 V202" fill="none" stroke="#a6a6ae" stroke-width="1.8" stroke-dasharray="5 4"/><text x="176" y="254" font-size="10" fill="#a6a6ae">CS0（高 · 无效）</text><path d="M170 270 H625 V202" fill="none" stroke="#2b7fff" stroke-width="1.8"/><text x="176" y="274" font-size="10" fill="#2b7fff">CS1（低 · 选中）</text><path d="M170 290 H795 V202" fill="none" stroke="#a6a6ae" stroke-width="1.8" stroke-dasharray="5 4"/><text x="176" y="294" font-size="10" fill="#a6a6ae">CS2（高 · 无效）</text><text x="460.0" y="318" font-size="11" text-anchor="middle" fill="#76767e">共享 SCLK / MOSI / MISO　·　独立 CS　·　任一时刻只有一个从机驱动 MISO，其余保持高阻</text><text x="20" y="348" font-size="12" font-weight="bold" fill="#1f1f23">模式切换时机</text><text x="205" y="346" font-size="11" text-anchor="middle" fill="#1f1f23">事务 A · 从机 k · Mode 0</text><path d="M100 352 H125 V364 H290 V352 H310" fill="none" stroke="#1f1f23" stroke-width="1.8"/><path d="M105 384 H140 H152 V372 H164 V384 H176 V372 H188 V384 H200 V372 H212 V384 H224 V372 H236 V384 H248 V372 H260 V384 H272 V372 H284 V384" fill="none" stroke="#76767e" stroke-width="1.4"/><text x="205" y="404" font-size="10" text-anchor="middle" fill="#e5484d">✗ 事务中途禁止改 CPOL / CPHA</text><text x="395" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#76767e">全部 CS 无效</text><path d="M315 360 H475 M315 366 H475" stroke="#a6a6ae" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/><text x="395" y="388" font-size="10" text-anchor="middle" fill="#76767e">只有在此间隙才允许改时钟约定</text><text x="395" y="404" font-size="10" text-anchor="middle" fill="#a6a6ae">空闲电平：低（Mode 0）→ 高（Mode 3）</text><text x="590" y="346" font-size="11" text-anchor="middle" fill="#1f1f23">事务 B · 从机 m · Mode 3</text><path d="M480 352 H505 V364 H670 V352 H700" fill="none" stroke="#1f1f23" stroke-width="1.8"/><path d="M490 372 H520 H532 V384 H544 V372 H556 V384 H568 V372 H580 V384 H592 V372 H604 V384 H616 V372 H628 V384 H640 V372 H652 V384 H664 V372" fill="none" stroke="#76767e" stroke-width="1.4"/><text x="460.0" y="446" font-size="12" font-anchor="middle" fill="#1f1f23"><tspan fill="#e5484d">⚠</tspan> 若某器件在 CS 无效时不能释放 MISO：按手册加三态缓冲或改变连接方式——电气争用无法靠软件忽略错误数据消除</text></svg>