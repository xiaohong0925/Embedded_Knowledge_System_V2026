<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" font-family="Noto Sans CJK SC,sans-serif"><defs><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1fa972"/></marker></defs><text x="440" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f1f23">独立片选多从机：一次只选中一个，只有它驱动 MISO</text><text x="440" y="46" font-size="11" text-anchor="middle" fill="#76767e">共享 SCLK / MOSI / MISO + 每从机一根独立 CS（N+3 根线）　·　图中选中从机 1，主机读到 0x40</text><line x1="160" y1="110" x2="870" y2="110" stroke="#1f1f23" stroke-width="1.8"/><line x1="160" y1="150" x2="870" y2="150" stroke="#1f1f23" stroke-width="1.8"/><line x1="164" y1="190" x2="870" y2="190" stroke="#1fa972" stroke-width="2.5" marker-end="url(#ahg)"/><text x="166" y="106" font-size="11" fill="#76767e">SCLK</text><text x="166" y="146" font-size="11" fill="#76767e">MOSI</text><text x="166" y="180" font-size="11" fill="#76767e">MISO</text><rect x="30" y="90" width="130" height="160" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="95" y="128" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f1f23">主机</text><circle cx="95" cy="172" r="17" fill="#1fa972"/><text x="95" y="177" font-size="13" font-weight="bold" text-anchor="middle" fill="white">40</text><text x="95" y="212" font-size="10" text-anchor="middle" fill="#76767e">MISO 输入</text><rect x="420" y="70" width="120" height="160" rx="8" fill="white" stroke="#e3e3e8" stroke-width="1"/><text x="480" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f1f23">从机 0</text><text x="480" y="118" font-size="10" text-anchor="middle" fill="#76767e">SPI Flash</text><text x="480" y="138" font-size="12" text-anchor="middle" fill="#1f1f23">ID = 0xEF</text><text x="480" y="216" font-size="10" text-anchor="middle" fill="#76767e">MISO 高阻</text><rect x="580" y="70" width="120" height="160" rx="8" fill="white" stroke="#1fa972" stroke-width="2"/>