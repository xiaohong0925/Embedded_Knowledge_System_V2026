<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">SPI 全双工移位</title>
<desc id="desc">主机和 Flash 各有一个八位移位寄存器，相同时钟下通过 MOSI 和 MISO 同时逐位交换。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18222d}
    .line{fill:none;stroke:#18222d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:none;stroke:#72808d;stroke-width:1.5;stroke-dasharray:5 5}
    .box{fill:#f5f7f9;stroke:#18222d;stroke-width:2}
    .accent{fill:none;stroke:#d95f02;stroke-width:3}
    .blue{fill:none;stroke:#1769aa;stroke-width:2.5}
    .label{font-size:18px} .small{font-size:15px;fill:#4c5966} .tiny{font-size:13px;fill:#4c5966}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-size="25" font-weight="700">同一组时钟，让两个移位寄存器同时移动</text><text x="500" y="68" text-anchor="middle" class="small">下图抽象一个字节；JEDEC 事务连续重复四组，Flash 从第二组开始给出有效身份字节</text><text x="210" y="118" text-anchor="middle" font-size="21">主机发送 / 接收</text><rect class="box" x="70" y="145" width="35" height="55"/><text x="87.5" y="179" text-anchor="middle" class="small">1</text><rect class="box" x="105" y="145" width="35" height="55"/><text x="122.5" y="179" text-anchor="middle" class="small">0</text><rect class="box" x="140" y="145" width="35" height="55"/><text x="157.5" y="179" text-anchor="middle" class="small">0</text><rect class="box" x="175" y="145" width="35" height="55"/><text x="192.5" y="179" text-anchor="middle" class="small">1</text><rect class="box" x="210" y="145" width="35" height="55"/><text x="227.5" y="179" text-anchor="middle" class="small">1</text><rect class="box" x="245" y="145" width="35" height="55"/><text x="262.5" y="179" text-anchor="middle" class="small">1</text><rect class="box" x="280" y="145" width="35" height="55"/><text x="297.5" y="179" text-anchor="middle" class="small">1</text><rect class="box" x="315" y="145" width="35" height="55"/><text x="332.5" y="179" text-anchor="middle" class="small">1</text><text x="210" y="228" text-anchor="middle" class="small">b7 → b0 依次上线，采回的位从另一端移入</text><text x="790" y="118" text-anchor="middle" font-size="21">Flash 发送 / 接收</text><rect class="box" x="650" y="145" width="35" height="55"/><text x="667.5" y="179" text-anchor="middle" class="small">d7</text><rect class="box" x="685" y="145" width="35" height="55"/><text x="702.5" y="179" text-anchor="middle" class="small">d6</text><rect class="box" x="720" y="145" width="35" height="55"/><text x="737.5" y="179" text-anchor="middle" class="small">d5</text><rect class="box" x="755" y="145" width="35" height="55"/><text x="772.5" y="179" text-anchor="middle" class="small">d4</text><rect class="box" x="790" y="145" width="35" height="55"/><text x="807.5" y="179" text-anchor="middle" class="small">d3</text><rect class="box" x="825" y="145" width="35" height="55"/><text x="842.5" y="179" text-anchor="middle" class="small">d2</text><rect class="box" x="860" y="145" width="35" height="55"/><text x="877.5" y="179" text-anchor="middle" class="small">d1</text><rect class="box" x="895" y="145" width="35" height="55"/><text x="912.5" y="179" text-anchor="middle" class="small">d0</text><text x="790" y="228" text-anchor="middle" class="small">b7 → b0 依次上线，采回的位从另一端移入</text><path class="blue" marker-end="url(#arrow)" d="M350 157H635"/><text x="492" y="143" text-anchor="middle" class="label">MOSI：主机输出，Flash 输入</text><path class="accent" marker-end="url(#arrow)" d="M650 260H365"/><text x="507" y="292" text-anchor="middle" class="label">MISO：Flash 输出，主机输入</text><path class="line" marker-end="url(#arrow)" d="M210 340V285H790V340"/><text x="500" y="326" text-anchor="middle" class="label">同一 SCLK：更新边沿换下一位，采样边沿读当前位</text><text x="500" y="405" text-anchor="middle" font-size="20">第 1 拍交换 b7，第 2 拍交换 b6，……，第 8 拍交换 b0</text><text x="500" y="440" text-anchor="middle" class="label">全双工只说明“同时移位”；某个方向是否有协议意义由器件命令定义</text><text x="500" y="478" text-anchor="middle" class="small">本例第一组 RX 位不解释；后三组分别为 EF、40、18</text>
</svg>