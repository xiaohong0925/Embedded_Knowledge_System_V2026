<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dummy 对齐</title><style>
:root{--kimi-font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
--kimi-color-text-primary:#1f1f23;--kimi-color-text-secondary:#54545a;--kimi-color-text-tertiary:#76767e;--kimi-color-text-quaternary:#a6a6ae;
--kimi-color-surface-muted:#f2f2f5;--kimi-color-surface-raised:#ffffff;--kimi-color-border:#e3e3e8;
--kimi-color-danger:#e5484d;--kimi-chart-1:#2b7fff;--kimi-chart-3:#1fa972;--t-fast:150ms;--ease-out:cubic-bezier(.2,.8,.2,1);}
@media (prefers-color-scheme: dark){:root{--kimi-color-text-primary:#ededf0;--kimi-color-text-secondary:#b9b9c0;--kimi-color-text-tertiary:#8f8f98;--kimi-color-text-quaternary:#5f5f66;--kimi-color-surface-muted:#26262b;--kimi-color-surface-raised:#1a1a1e;--kimi-color-border:#38383f;--kimi-color-danger:#f2555a;--kimi-chart-1:#5ea2ff;--kimi-chart-3:#2fbf85;}}
html,body{background:transparent;margin:0;padding:16px;}
</style></head><body>

<style>
#dmy button{border:1px solid var(--kimi-color-border);background:transparent;color:var(--kimi-color-text-primary);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;transition:background var(--t-fast,150ms) var(--ease-out,ease-out)}
#dmy button:hover{background:var(--kimi-color-surface-muted)}
#dmy .chip{border:1px solid var(--kimi-color-border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--kimi-color-text-tertiary);background:transparent}
#dmy .chip.on{color:var(--kimi-color-text-primary);font-weight:500;border-color:var(--kimi-color-text-primary)}
#dmy .slide{transition:transform .5s var(--ease-out,cubic-bezier(.2,.8,.2,1))}
#dmy svg text{font-family:var(--kimi-font-sans,sans-serif)}
</style>
<div id="dmy" style="font-family:var(--kimi-font-sans,sans-serif);color:var(--kimi-color-text-primary);max-width:920px;margin:0 auto;">
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;">
    <span style="font-size:13px;color:var(--kimi-color-text-tertiary);">主机发了多少前导拍？</span>
    <button class="chip scn" data-k="less">少给 dummy（32 拍）</button>
    <button class="chip scn on" data-k="normal">正常（40 拍）</button>
    <button class="chip scn" data-k="more">多发 8 拍（48 拍）</button>
  </div>
  <svg id="dmySvg" viewBox="0 0 920 240" style="width:100%;height:auto;display:block;"></svg>
  <div id="dmyVerdict" style="font-size:14px;margin:10px 0;"></div>
  <div id="dmyNote" style="font-size:12px;color:var(--kimi-color-text-tertiary);line-height:1.7;"></div>
</div>
<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('dmySvg');
function E(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function T(x,y,s,a,p){var t=E('text',{x:x,y:y,'font-size':a.fs||11,fill:a.fill||'var(--kimi-color-text-secondary)'},p);if(a.ta)t.setAttribute('text-anchor',a.ta);t.textContent=s;return t;}
var INK='var(--kimi-color-text-primary)',GRAY='var(--kimi-color-text-tertiary)',QGRAY='var(--kimi-color-text-quaternary)',BORD='var(--kimi-color-border)';
var BLUE='var(--kimi-chart-1)',GREEN='var(--kimi-chart-3)',RED='var(--kimi-color-danger)';
var BLUE_BG='color-mix(in srgb, var(--kimi-chart-1) 12%, transparent)';
var GREEN_BG='color-mix(in srgb, var(--kimi-chart-3) 12%, transparent)';
var RED_BG='color-mix(in srgb, var(--kimi-color-danger) 10%, transparent)';

var X0=80,BEAT=14;
function bx(b){return X0+(b-1)*BEAT;}
var Y1=64,H=22;

T(76,44,'Flash 视角（数时钟的状态机）',{fs:12,ta:'end',fill:INK},svg).setAttribute('font-weight','bold');
// 阶段条：命令8 地址24 dummy8 数据16
var segs=[[1,8,'命令 0B',BLUE_BG,BLUE],[9,32,'地址 00 12 34',BLUE_BG,BLUE],[33,40,'dummy 8 拍','color-mix(in srgb, var(--kimi-color-text-quaternary) 14%, transparent)',QGRAY],[41,56,'数据（Flash 从第 41 拍起吐字节）',GREEN_BG,GREEN]];
segs.forEach(function(s){
  var x=bx(s[0]),w=(s[1]-s[0]+1)*BEAT;
  E('rect',{x:x,y:Y1,width:w,height:H,fill:s[3],stroke:s[4],'stroke-width':1},svg);
  T(x+w/2,Y1+15,s[2],{fs:10,ta:'middle',fill:s[4]},svg);
});
// 数据字节刻度
[['A7',41,48],['5C',49,56]].forEach(function(b){
  T((bx(b[1])+bx(b[2])+BEAT)/2,Y1+H+14,b[0],{fs:11,ta:'middle',fill:GREEN},svg).setAttribute('font-weight','bold');
});
// 拍号刻度
[[1,'1'],[8,'8'],[9,'9'],[32,'32'],[33,'33'],[40,'40'],[41,'41'],[48,'48']].forEach(function(t){
  E('line',{x1:bx(t[0]),y1:Y1+H+22,x2:bx(t[0]),y2:Y1+H+27,stroke:QGRAY,'stroke-width':1},svg);
  T(bx(t[0]),Y1+H+38,t[1],{fs:8,ta:'middle',fill:QGRAY},svg);
});

// 主机窗口（可滑动）
T(76,150,'主机视角',{fs:12,ta:'end',fill:INK},svg).setAttribute('font-weight','bold');
var gWin=E('g',{class:'slide'},svg);
E('rect',{x:bx(41),y:138,width:8*BEAT,height:30,fill:RED_BG,stroke:RED,'stroke-width':1.6,rx:4},gWin);
T(bx(41)+4*BEAT,132,'主机 RX[0] 窗口（8 拍）',{fs:10,ta:'middle',fill:RED},gWin);
var gLead=E('g',{class:'slide'},svg);
E('line',{x1:bx(41),y1:120,x2:bx(41),y2:176,stroke:RED,'stroke-width':1.2,'stroke-dasharray':'4 3'},gLead);
T(bx(41)+4,186,'前导结束',{fs:9,ta:'middle',fill:RED},gLead);

var SCN={
  less:{dx:-8,lead:'32',v:'采到的是 dummy 期的无效输出——Flash 还没准备好，首字节直接错。'},
  normal:{dx:0,lead:'40',v:'对齐：窗口正好盖住 A7 的 8 拍，收到 A7。'},
  more:{dx:8,lead:'48',v:'窗口从第 49 拍才开始——A7 被跳过，收到的是 5C；按 4 字节读还会丢掉尾字节。'}
};
var verdict=document.getElementById('dmyVerdict'),note=document.getElementById('dmyNote');
note.textContent='机制：Flash 从 CS 拉低起数时钟——数够 8 拍当命令、再 24 拍当地址、再 8 拍 dummy，之后每 8 拍吐一个数据字节。它不知道软件怎么想；主机给的前导拍数一旦和手册不一致，两边的"格子"就错了位。dummy 期间传输的字节无意义，有意义的是它的拍数。';
function apply(k){
  var s=SCN[k];
  gWin.setAttribute('transform','translate('+(s.dx*BEAT)+',0)');
  gLead.setAttribute('transform','translate('+(s.dx*BEAT)+',0)');
  verdict.textContent='前导 '+s.lead+' 拍：'+s.v;
  verdict.style.color=k==='normal'?'var(--kimi-chart-3)':'var(--kimi-color-danger)';
}
document.querySelectorAll('#dmy .scn').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#dmy .scn').forEach(function(x){x.className='chip scn';});
    b.className='chip scn on';
    apply(b.dataset.k);
  };
});
apply('normal');
})();
</script>
</body></html>
