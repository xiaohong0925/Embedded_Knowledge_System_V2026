<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 268" width="920" height="268" font-family="Noto Sans CJK SC,sans-serif"><text x="460" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f1f23">SPI 事务与指令序列：标准管传输，手册管含义</text><text x="20" y="74" font-size="12" font-weight="bold" fill="#1f1f23">通用形状</text><rect x="130" y="48" width="100" height="46" rx="6" fill="#fafafa" stroke="#1f1f23" stroke-width="1"/><text x="180.0" y="67" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f1f23">命令</text><text x="180.0" y="83" font-size="10" text-anchor="middle" fill="#76767e">必有 · 1 字节</text><rect x="236" y="48" width="120" height="46" rx="6" fill="#fafafa" stroke="#76767e" stroke-width="1" stroke-dasharray="5 4"/><text x="296.0" y="67" font-size="11" font-weight="bold" text-anchor="middle" fill="#76767e">地址</text><text x="296.0" y="83" font-size="10" text-anchor="middle" fill="#76767e">可选 · 0~3 字节</text><rect x="362" y="48" width="120" height="46" rx="6" fill="#fafafa" stroke="#76767e" stroke-width="1" stroke-dasharray="5 4"/><text x="422.0" y="67" font-size="11" font-weight="bold" text-anchor="middle" fill="#76767e">dummy</text><text x="422.0" y="83" font-size="10" text-anchor="middle" fill="#76767e">可选 · 给器件留时间</text><rect x="488" y="48" width="200" height="46" rx="6" fill="#fafafa" stroke="#1f1f23" stroke-width="1"/><text x="588.0" y="67" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f1f23">数据</text><text x="588.0" y="83" font-size="10" text-anchor="middle" fill="#76767e">读：从机→主机</text><text x="20" y="136" font-size="12" font-weight="bold" fill="#1f1f23">例 1 · B-B.4.1</text><rect x="130" y="110" width="100" height="46" rx="6" fill="#eaf3ff" stroke="#2b7fff" stroke-width="1"/><text x="180.0" y="129" font-size="11" font-weight="bold" text-anchor="middle" fill="#2b7fff">9F</text><text x="180.0" y="145" font-size="10" text-anchor="middle" fill="#76767e">命令</text><rect x="236" y="110" width="120" height="46" rx="6" fill="#fafafa" stroke="#a6a6ae" stroke-width="1" stroke-dasharray="5 4"/><text x="296.0" y="129" font-size="11" font-weight="bold" text-anchor="middle" fill="#a6a6ae">（无地址段）</text><text x="296.0" y="145" font-size="10" text-anchor="middle" fill="#76767e">读 ID 不需要</text><rect x="362" y="110" width="120" height="46" rx="6" fill="#fafafa" stroke="#a6a6ae" stroke-width="1" stroke-dasharray="5 4"/><text x="422.0" y="129" font-size="11" font-weight="bold" text-anchor="middle" fill="#76767e">00 00 00</text><text x="422.0" y="145" font-size="10" text-anchor="middle" fill="#76767e">占位：只为维持时钟</text><rect x="488" y="110" width="200" height="46" rx="6" fill="#e8f7f0" stroke="#1fa972" stroke-width="1"/><text x="588.0" y="129" font-size="11" font-weight="bold" text-anchor="middle" fill="#1fa972">EF 40 18</text><text x="588.0" y="145" font-size="10" text-anchor="middle" fill="#76767e">JEDEC ID</text><text x="20" y="198" font-size="12" font-weight="bold" fill="#1f1f23">例 2 · B-B.4.2</text><rect x="130" y="172" width="100" height="46" rx="6" fill="#eaf3ff" stroke="#2b7fff" stroke-width="1"/><text x="180.0" y="191" font-size="11" font-weight="bold" text-anchor="middle" fill="#2b7fff">0B</text><text x="180.0" y="207" font-size="10" text-anchor="middle" fill="#76767e">Fast Read 命令</text><rect x="236" y="172" width="120" height="46" rx="6" fill="#eaf3ff" stroke="#2b7fff" stroke-width="1"/><text x="296.0" y="191" font-size="11" font-weight="bold" text-anchor="middle" fill="#2b7fff">00 12 34</text><text x="296.0" y="207" font-size="10" text-anchor="middle" fill="#76767e">地址 · MSB 先</text><rect x="362" y="172" width="120" height="46" rx="6" fill="#fafafa" stroke="#76767e" stroke-width="1"/><text x="422.0" y="191" font-size="11" font-weight="bold" text-anchor="middle" fill="#76767e">00</text><text x="422.0" y="207" font-size="10" text-anchor="middle" fill="#76767e">dummy：内部寻址</text><rect x="488" y="172" width="200" height="46" rx="6" fill="#e8f7f0" stroke="#1fa972" stroke-width="1"/><text x="588.0" y="191" font-size="11" font-weight="bold" text-anchor="middle" fill="#1fa972">A7 5C 3F 19</text><text x="588.0" y="207" font-size="10" text-anchor="middle" fill="#76767e">地址起 4 字节数据</text><text x="130" y="242" font-size="11" fill="#76767e">SPI 标准只定义"CS 拉低→拉高的一次事务"和字节怎么传（Mode、位序、全双工）；事务内部的字节序列叫指令序列（instruction sequence），各段有无与长度由器件手册定义。</text><text x="130" y="260" font-size="11" fill="#76767e">注意："帧"是借用的口语说法，实际资料里也叫 SPI frame；规范术语是事务 + 指令序列。两例的 00 成因不同：例 1 占位维持时钟，例 2 给 Flash 内部寻址留时间。</text></svg>