<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
<title id="title">SPI MISO 从启动边沿到主机采样的建立时间预算</title>
<desc id="desc">Mode 0 示例中，从机下降沿启动输出，经过 tCLQV 和走线传播，在主机上升沿采样前满足建立时间与余量。50 MHz 半周期 10 ns，扣除 6 ns 后余 4 ns；25 MHz 半周期 20 ns，扣除后余 14 ns，仍不能直接判定足够。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18222d}
    .line{fill:none;stroke:#18222d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:none;stroke:#72808d;stroke-width:1.5;stroke-dasharray:5 5}
    .box{fill:#f5f7f9;stroke:#18222d;stroke-width:2}
    .accent{fill:none;stroke:#d95f02;stroke-width:3}
    .blue{fill:none;stroke:#1769aa;stroke-width:2.5}
    .label{font-size:18px}.small{font-size:15px;fill:#4c5966}.tiny{font-size:13px;fill:#4c5966}
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="750" y="40" text-anchor="middle" font-size="25" font-weight="700">MISO 建立路径：可用时间要逐项支付，不是只看 SCLK 频率</text>
<text x="750" y="70" text-anchor="middle" class="small">Mode 0、启动与采样相隔半周期的教学演算；时间轴为预算示意，不是示波器实测</text>

<text x="45" y="145" class="label">SCLK</text>
<path class="line" d="M180 115H220V175H1320V115H1360"/>
<circle cx="220" cy="175" r="5" fill="#1769aa"/><circle cx="1320" cy="115" r="5" fill="#d95f02"/>
<text x="220" y="205" text-anchor="middle" class="small">下降沿：从机启动</text><text x="1320" y="145" text-anchor="middle" class="small">上升沿：主机采样</text>
<path class="soft" d="M220 215V390"/><path class="soft" d="M520 215V390"/><path class="soft" d="M850 215V390"/><path class="soft" d="M1320 215V390"/>

<text x="45" y="270" class="label">从机 MISO</text>
<path class="soft" d="M180 250H520"/><path class="line" d="M520 230V290H1320"/><text x="520" y="320" text-anchor="middle" class="small">输出变为有效</text>
<text x="45" y="365" class="label">主机输入</text>
<path class="soft" d="M180 345H850"/><path class="line" d="M850 325V385H1320"/><text x="850" y="415" text-anchor="middle" class="small">传播后到达</text>

<path class="blue" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M225 235H515"/><text x="370" y="226" text-anchor="middle" class="small">tCLQV(max) = 6 ns</text>
<path class="blue" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M525 345H845"/><text x="685" y="336" text-anchor="middle" class="small">tflight</text>
<rect x="850" y="425" width="470" height="46" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/>
<text x="1085" y="454" text-anchor="middle" class="small">采样前还须容纳 tSU_host 与 margin</text>
<path class="accent" marker-end="url(#arrow)" d="M1085 480V500H1320V480"/>

<text x="750" y="535" text-anchor="middle" font-size="20">Δt_launch_to_sample ≥ tV(max) + tflight + tSU_host + margin</text>
<text x="750" y="565" text-anchor="middle" class="small">本例左右两侧相隔 T/2；换成其他边沿关系时，必须改算真实间隔</text>

<text x="45" y="625" font-size="20" font-weight="700">代入 W25Q128JV 在 3.0～3.6 V 档的 tCLQV(max) = 6 ns</text>
<text x="45" y="680" class="label">50 MHz</text>
<rect x="220" y="650" width="300" height="52" fill="#e8f1f8" stroke="#1769aa" stroke-width="2"/><rect x="520" y="650" width="200" height="52" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/>
<text x="370" y="682" text-anchor="middle" class="small">tCLQV 6 ns</text><text x="620" y="682" text-anchor="middle" class="small">其余合计约 4 ns</text>
<text x="750" y="682" class="small">可用 T/2 = 10 ns</text>
<text x="45" y="760" class="label">25 MHz</text>
<rect x="220" y="730" width="300" height="52" fill="#e8f1f8" stroke="#1769aa" stroke-width="2"/><rect x="520" y="730" width="700" height="52" fill="#fff1e5" stroke="#d95f02" stroke-width="2"/>
<text x="370" y="762" text-anchor="middle" class="small">tCLQV 6 ns</text><text x="870" y="762" text-anchor="middle" class="small">tflight + tSU_host + margin 的合计预算约 14 ns</text>
<text x="1250" y="762" class="small">T/2 = 20 ns</text>
<text x="750" y="817" text-anchor="middle" class="label">降速增加的是预算；是否足够，仍须代入实际传播、主机建立要求与余量</text>
</svg>
