<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 690" role="img" aria-labelledby="title desc">
<title id="title">Mode 0 的完整 32 拍 JEDEC ID 波形</title>
<desc id="desc">CS 拉低后连续 32 个时钟，MOSI 为 9F 后接三个 00，MISO 前八位不解释，之后为 EF 40 18，上升沿采样，下降沿更新。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
