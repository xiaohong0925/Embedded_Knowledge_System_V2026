<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 285" width="890" height="285" font-family="Noto Sans CJK SC,sans-serif"><text x="142" y="20" font-size="14" font-weight="bold" fill="#1f1f23" text-anchor="middle">状态一 · 选中并输出 1</text><rect x="10" y="34" width="120" height="110" rx="6" fill="#fafafa" stroke="#a6a6ae"/><text x="22" y="54" font-size="11" fill="#76767e">VCC</text><line x1="52" y1="58" x2="100" y2="58" stroke="#76767e" stroke-width="1.4"/><line x1="100" y1="58" x2="100" y2="89" stroke="#1fa972" stroke-width="3"/><text x="90" y="78" font-size="10" fill="#76767e" text-anchor="end">上拉</text><circle cx="100" cy="96" r="3.5" fill="#1f1f23"/><line x1="100" y1="96" x2="100" y2="104" stroke="#a6a6ae" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="100" y1="104" x2="108" y2="116" stroke="#a6a6ae" stroke-width="1.6"/><line x1="100" y1="127" x2="100" y2="127" stroke="none"/><text x="90" y="116" font-size="10" fill="#76767e" text-anchor="end">下拉</text><line x1="100" y1="127" x2="100" y2="131" stroke="#76767e" stroke-width="1.4"/><line x1="90" y1="131" x2="110" y2="131" stroke="#76767e" stroke-width="1.4"/><line x1="94" y1="135" x2="106" y2="135" stroke="#76767e" stroke-width="1.4"/><line x1="100" y1="96" x2="160" y2="96" stroke="#1f1f23" stroke-width="1.8"/><line x1="160" y1="96" x2="160" y2="96" stroke="none"/><line x1="160" y1="96" x2="230" y2="96" stroke="#1f1f23" stroke-width="2"/><text x="195" y="88" font-size="11" fill="#76767e" text-anchor="middle">MISO</text><path d="M100 58 V96 H160" fill="none" stroke="#1fa972" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="245" cy="96" r="13" fill="white" stroke="#a6a6ae"/><circle cx="245" cy="96" r="13" fill="#1fa972"/><text x="245" y="100" font-size="13" fill="white" text-anchor="middle">1</text><text x="245" y="126" font-size="11" fill="#76767e" text-anchor="middle">主机</text><text x="142" y="215" font-size="11" fill="#76767e" text-anchor="middle">开关闭合，输出级主动把 MISO 拉高</text><text x="142" y="232" font-size="11" fill="#76767e" text-anchor="middle">主机采到 1；高电平不需要上拉电阻</text><text x="442" y="20" font-size="14" font-weight="bold" fill="#1f1f23" text-anchor="middle">状态二 · 释放后高阻</text><rect x="310" y="34" width="120" height="110" rx="6" fill="#fafafa" stroke="#a6a6ae"/><text x="322" y="54" font-size="11" fill="#76767e">VCC</text><line x1="352" y1="58" x2="400" y2="58" stroke="#76767e" stroke-width="1.4"/><line x1="400" y1="58" x2="400" y2="70" stroke="#a6a6ae" stroke-width="1.6"/><line x1="400" y1="70" x2="408" y2="84" stroke="#a6a6ae" stroke-width="1.6"/><line x1="400" y1="89" x2="400" y2="89" stroke="none"/><line x1="400" y1="82" x2="400" y2="89" stroke="#a6a6ae" stroke-width="1.6" stroke-dasharray="3 3"/><text x="390" y="78" font-size="10" fill="#76767e" text-anchor="end">上拉</text><circle cx="400" cy="96" r="3.5" fill="#1f1f23"/><line x1="400" y1="96" x2="400" y2="104" stroke="#a6a6ae" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="400" y1="104" x2="408" y2="116" stroke="#a6a6ae" stroke-width="1.6"/><line x1="400" y1="127" x2="400" y2="127" stroke="none"/><text x="390" y="116" font-size="10" fill="#76767e" text-anchor="end">下拉</text><line x1="400" y1="127" x2="400" y2="131" stroke="#76767e" stroke-width="1.4"/><line x1="390" y1="131" x2="410" y2="131" stroke="#76767e" stroke-width="1.4"/><line x1="394" y1="135" x2="406" y2="135" stroke="#76767e" stroke-width="1.4"/><line x1="400" y1="96" x2="460" y2="96" stroke="#a6a6ae" stroke-width="1.8" stroke-dasharray="5 4"/><rect x="410" y="64" width="44" height="18" rx="9" fill="white" stroke="#a6a6ae"/><text x="432" y="77" font-size="10" fill="#76767e" text-anchor="middle">高阻</text><line x1="460" y1="96" x2="530" y2="96" stroke="#a6a6ae" stroke-width="2" stroke-dasharray="5 4"/><text x="495" y="88" font-size="11" fill="#76767e" text-anchor="middle">MISO</text><circle cx="545" cy="96" r="13" fill="white" stroke="#a6a6ae"/><circle cx="545" cy="96" r="13" fill="white" stroke="#a6a6ae" stroke-width="1.6" stroke-dasharray="4 3"/><text x="545" y="100" font-size="13" fill="#76767e" text-anchor="middle">–</text><text x="545" y="126" font-size="11" fill="#76767e" text-anchor="middle">主机</text><text x="442" y="215" font-size="11" fill="#76767e" text-anchor="middle">/CS 无效 → 两个开关都断开，退出线路</text><text x="442" y="232" font-size="11" fill="#76767e" text-anchor="middle">既不拉高也不拉低，线交给其他从机</text><text x="742" y="20" font-size="14" font-weight="bold" fill="#1f1f23" text-anchor="middle">状态三 · 同时选中争用</text><rect x="610" y="34" width="120" height="60" rx="6" fill="#fafafa" stroke="#a6a6ae"/><text x="670" y="50" font-size="11" fill="#76767e" text-anchor="middle">从机 0 · 输出 1</text><line x1="630" y1="66" x2="690" y2="66" stroke="#76767e" stroke-width="1.4"/><line x1="690" y1="66" x2="690" y2="86" stroke="#1fa972" stroke-width="3"/><circle cx="690" cy="88" r="3.5" fill="#1f1f23"/><line x1="690" y1="88" x2="760" y2="88" stroke="#1f1f23" stroke-width="1.8"/><rect x="610" y="150" width="120" height="60" rx="6" fill="#fafafa" stroke="#a6a6ae"/><text x="670" y="166" font-size="11" fill="#76767e" text-anchor="middle">从机 1 · 输出 0</text><line x1="690" y1="196" x2="690" y2="204" stroke="#76767e" stroke-width="1.4"/><line x1="680" y1="204" x2="700" y2="204" stroke="#76767e" stroke-width="1.4"/><line x1="690" y1="176" x2="690" y2="196" stroke="#1fa972" stroke-width="3"/><circle cx="690" cy="176" r="3.5" fill="#1f1f23"/><line x1="690" y1="176" x2="760" y2="176" stroke="#1f1f23" stroke-width="1.8"/><line x1="760" y1="88" x2="760" y2="176" stroke="#1f1f23" stroke-width="1.8"/><line x1="760" y1="132" x2="868" y2="132"/><circle cx="760" cy="132" r="3" fill="#1f1f23"/> stroke="#1f1f23" stroke-width="2"/><text x="795" y="124" font-size="11" fill="#76767e" text-anchor="middle">MISO</text><path d="M690 66 V88 H760 V176 H690 V196" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="772" y="118" width="78" height="20" rx="10" fill="white" stroke="#e5484d"/><text x="811" y="132" font-size="11" fill="#e5484d" text-anchor="middle">直通电流</text><circle cx="882" cy="132" r="13" fill="white" stroke="#a6a6ae"/><circle cx="882" cy="132" r="13" fill="#e5484d"/><text x="882" y="136" font-size="13" fill="white" text-anchor="middle">!</text><text x="882" y="162" font-size="11" fill="#76767e" text-anchor="middle">主机</text><text x="742" y="240" font-size="11" fill="#76767e" text-anchor="middle">一个拉向 VCC、一个拉向 GND，电平不可信</text><text x="742" y="257" font-size="11" fill="#76767e" text-anchor="middle">电流穿过两个输出级，可能过热损坏</text></svg>