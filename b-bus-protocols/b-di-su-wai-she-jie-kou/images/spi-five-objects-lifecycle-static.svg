"8" fill="#fff8eb" stroke="#f5a623" stroke-width="1.4"/><text x="600.0" y="132" font-size="11" font-weight="bold" text-anchor="middle" fill="#f5a623">spi_driver</text><text x="600.0" y="152" font-size="9" text-anchor="middle" fill="#a6a6ae">教学协议驱动</text><rect x="520" y="220" width="160" height="56" rx="8" fill="#f0f0f2" stroke="#e3e3e8" stroke-width="1.4"/><text x="600.0" y="242" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a4a52">spi_message</text><text x="600.0" y="262" font-size="9" text-anchor="middle" fill="#a6a6ae">一次读取</text><rect x="760" y="220" width="140" height="56" rx="8" fill="#f0f0f2" stroke="#e3e3e8" stroke-width="1.4"/><text x="830.0" y="242" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a4a52">spi_transfer[2]</text><text x="830.0" y="262" font-size="9" text-anchor="middle" fill="#a6a6ae">两段传输</text><line x1="200" y1="88" x2="280" y2="130" stroke="#2b7fff" stroke-width="1.4" marker-end="url(#arrb)"/><text x="245" y="100" font-size="8" text-anchor="middle" fill="#2b7fff">根据 DTS 创建</text><line x1="200" y1="188" x2="280" y2="150" stroke="#7c4dff" stroke-width="1.4" marker-end="url(#arrp)"/><text x="235" y="180" font-size="8" text-anchor="middle" fill="#7c4dff">所属控制器</text><line x1="440" y1="138" x2="520" y2="138" stroke="#1fa972" stroke-width="1.4" marker-end="url(#arrg)"/><text x="480" y="130" font-size="8" text-anchor="middle" fill="#1fa972">匹配后 probe 参数</text><line x1="600" y1="166" x2="600" y2="220" stroke="#f5a623" stroke-width="1.4" marker-end="url(#arro)"/><text x="620" y="196" font-size="8" fill="#f5a623">组装</text><line x1="680" y1="248" x2="760" y2="248" stroke="#76767e" stroke-width="1.4" marker-end="url(#arr)"/><text x="720" y="240" font-size="8" text-anchor="middle" fill="#76767e">顺序包含</text><path d="M580 166 Q480 280 200 188" fill="none" stroke="#f5a623" stroke-width="1.4" marker-end="url(#arro)"/><text x="360" y="260" font-size="8" text-anchor="middle" fill="#f5a623">spi_sync() 提交</text><rect x="500" y="2