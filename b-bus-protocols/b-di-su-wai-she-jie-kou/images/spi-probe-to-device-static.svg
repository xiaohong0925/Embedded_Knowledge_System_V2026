<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="Noto Sans CJK SC,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#76767e"/></marker></defs><text x="460" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f1f23">控制器注册到设备创建：两个阶段的分界线</text><rect x="40" y="50" width="240" height="110" rx="8" fill="#fafafa" stroke="#e3e3e8"/><text x="160" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f1f23">阶段 1：控制器 probe</text><text x="55" y="96" font-size="10" font-family="monospace" fill="#2b7fff">spi_alloc_host()</text><text x="55" y="114" font-size="10" font-family="monospace" fill="#1f1f23">ctlr-&gt;transfer_one = rk_trans</text><text x="55" y="132" font-size="10" font-family="monospace" fill="#1f1f23">ctlr-&gt;set_cs = rk_set_cs</text><text x="55" y="150" font-size="10" font-family="monospace" fill="#1fa972">devm_spi_register_controller()</text><line x1="280" y1="105" x2="340" y2="105" stroke="#76767e" stroke-width="1.4" marker-end="url(#arr)"/><text x="310" y="98" font-size="9" text-anchor="middle" fill="#76767e">注册成功</text><rect x="340" y="50" width="240" height="110" rx="8" fill="#eaf3ff" stroke="#2b7fff"/><text x="460" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f1f23">阶段 2：Core 遍历子节点</text><text x="355" y="96" font-size="10" font-family="monospace" fill="#1f1f23">of_register_spi_devices()</text><text x="355" y="114" font-size="10" font-family="monospace" fill="#1f1f23">遍历控制器节点下子节点</text><text x="355" y="132" font-size="10" font-family="monospace" fill="#1f1f23">解析 compatible / reg / freq</text><text x="355" y="150" font-size="10" font-family="monospace" fill="#1fa972">spi_add_device() → spi1.0</text><line x1="580" y1="105" x2="640" y2="105" stroke="#76767e" stroke-width="1.4" marker-end="url(#arr)"/><text x="610" y="98" font-size="9" text-anchor="middle" fill="#76767e">匹配成功</text><rect x="640" y="50" width="240" height="110" rx="8" fill="#e8f7f0" stroke="#1fa972"/><text x="760" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f1f23">阶段 3：协议驱动 probe</text><text x="655" y="96" font-size="10" font-family="monospace" fill="#1f1f23">compatible 匹配</text><text x="655" y="114" font-size="10" font-family="monospace" fill="#1f1f23">进入 spi_frame_observer_probe</text><text x="655" y="132" font-size="10" font-family="monospace" fill="#1f1f23">参数：spi_device *spi</text><text x="655" y="150" font-size="10" font-family="monospace" fill="#1fa972">驱动开始组装 spi_message</text><line x1="340" y1="180" x2="340" y2="230" stroke="#2b7fff" stroke-width="1.4" stroke-dasharray="4 3"/><text x="345" y="200" font-size="10" fill="#2b7fff">分界线</text><text x="345" y="215" font-size="9" fill="#2b7fff">阶段 1 是</text><text x="345" y="230" font-size="9" fill="#2b7fff">控制器驱动的事</text><line x1="580" y1="180" x2="580" y2="230" stroke="#1fa972" stroke-width="1.4" stroke-dasharray="4 3"/><text x="585" y="200" font-size="10" fill="#1fa972">分界线</text><text x="585" y="215" font-size="9" fill="#1fa972">阶段 2 是</text><text x="585" y="230" font-size="9" fill="#1fa972">SPI Core 的事</text><rect x="40" y="260" width="840" height="56" rx="8" fill="#fff8eb" stroke="#f5a623"/><text x="460" y="284" font-size="11" text-anchor="middle" fill="#1f1f23">阶段 1 结束标志：devm_spi_register_controller() 返回 0 → 控制器对象已注册到内核</text><text x="460" y="304" font-size="11" text-anchor="middle" fill="#1f1f23">阶段 2 结束标志：spi_add_device() 返回 0 → 外设对象已创建，等待 compatible 匹配驱动</text></svg>